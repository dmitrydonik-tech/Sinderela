name: tests

# Гоняет тесты на каждый push/PR. НИЧЕГО НЕ ДЕПЛОИТ — сайт остаётся статическим
# (GitHub Pages публикует index.html+assets как есть). Это только «турникет» качества.
# Тесты РАЗБИТЫ на отдельные шаги, чтобы на сводке было видно, какой именно упал.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: check-site (SEO/meta)
        run: node tests/check-site.mjs
      - name: icons (страж ICONVER)
        run: node tests/icons.mjs
      - name: pricing (цены + синк + снапшот)
        run: node tests/pricing.mjs
      - name: i18n (полнота переводов)
        run: node tests/i18n.mjs
